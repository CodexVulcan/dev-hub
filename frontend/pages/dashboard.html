  <style>
    .board { position:relative; width:100%; height:640px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
    .board-card { position:absolute; width:220px; border-radius:var(--radius-lg); padding:12px 14px; cursor:grab; box-shadow:0 3px 12px rgba(0,0,0,.35); font-size:13px; }
    .board-card:active { cursor:grabbing; }
    .board-card .card-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
    .board-card .card-head strong { font-size:13.5px; color:#1f2328; }
    .board-card .del-card { background:none;border:none;cursor:pointer;font-size:14px;color:#666;padding:0; }
    .board-card .card-body-text { font-size:12.5px; color:#444; margin-bottom:8px; }
    .board-card .card-author { font-size:11px; color:#888; }
    .board-card .toggle-comments { font-size:11px; color:#3b82f6; cursor:pointer; background:none;border:none;margin-top:4px; }
    .comments-panel { border-top:1px solid rgba(0,0,0,.12); margin-top:8px; padding-top:8px; }
    .comment-item { font-size:11.5px; color:#333; margin-bottom:4px; }
    .comment-form { display:flex; gap:4px; margin-top:6px; }
    .comment-form input { flex:1; border:1px solid #ccc; border-radius:4px; padding:3px 6px; font-size:11.5px; }
    .comment-form button { background:#3b82f6; color:#fff; border:none; border-radius:4px; padding:3px 8px; cursor:pointer; font-size:11px; }
  </style>

  <main class="main-content">
        <div class="page-header">
      <div class="page-header-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>

    <div class="card">
      <div class="card-title">New Card</div>
      <div class="grid-3 gap-12">
        <div class="form-group" style="margin:0"><label class="form-label">Title</label><input id="c-title" class="form-input" placeholder="Idea title" /></div>
        <div class="form-group" style="margin:0"><label class="form-label">Author</label><input id="c-author" class="form-input" placeholder="Your name" /></div>
        <div class="form-group" style="margin:0"><label class="form-label">Color</label>
          <select id="c-color" class="form-select">
            <option value="#fffacd">Yellow</option><option value="#d4f1f9">Blue</option>
            <option value="#d5f5e3">Green</option><option value="#fde8d8">Orange</option><option value="#e8daef">Purple</option>
          </select>
        </div>
      </div>
      <div class="form-group mt-8"><label class="form-label">Body (optional)</label><textarea id="c-body" class="form-textarea" placeholder="Details�" style="min-height:52px"></textarea></div>
      <button class="btn btn-primary" onclick="createCard()">Post Card</button>
    </div>

    <div class="board mt-16" id="board"></div>
  </main>

<script src="../static/app.js"></script><script src="../static/api-client.js"></script>
<script>
let _cards = [];

async function loadCards() {
  try { const {cards} = await ApiClient.dashboard.list(); _cards = cards; renderCards(); }
  catch(e) { toast(e.message,'error'); }
}

function renderCards() {
  const board = document.getElementById('board');
  board.querySelectorAll('.board-card').forEach(el => el.remove());
  _cards.forEach(card => mountCard(card));
}

function mountCard(card) {
  const board = document.getElementById('board');
  const el = document.createElement('div');
  el.className = 'board-card';
  el.style.left = card.x + 'px'; el.style.top = card.y + 'px';
  el.style.background = card.color;
  el.dataset.id = card.id;
  el.innerHTML = `
    <div class="card-head">
      <strong>${escHtml(card.title)}</strong>
      <button class="del-card" onclick="deleteCard('${card.id}')">?</button>
    </div>
    ${card.body ? `<div class="card-body-text">${escHtml(card.body)}</div>` : ''}
    <div class="card-author">� ${escHtml(card.author)}</div>
    <button class="toggle-comments" onclick="toggleComments('${card.id}')">?? ${card.comments.length} comment${card.comments.length!==1?'s':''}</button>
    <div class="comments-panel" id="cp-${card.id}" style="display:none">
      ${card.comments.map(c => `<div class="comment-item"><strong>${escHtml(c.author)}</strong>: ${escHtml(c.text)}</div>`).join('')}
      <div class="comment-form">
        <input id="cm-text-${card.id}" placeholder="Add comment�" />
        <input id="cm-author-${card.id}" placeholder="Name" style="max-width:70px" />
        <button onclick="addComment('${card.id}')">Post</button>
      </div>
    </div>`;
  makeDraggable(el, card);
  board.appendChild(el);
}

function makeDraggable(el, card) {
  let ox=0, oy=0, moved=false;
  el.addEventListener('mousedown', e => {
    if (['INPUT','BUTTON','TEXTAREA'].includes(e.target.tagName)) return;
    moved = false;
    ox = e.clientX - card.x; oy = e.clientY - card.y;
    const mm = ev => {
      moved = true;
      card.x = ev.clientX - ox; card.y = ev.clientY - oy;
      el.style.left = card.x + 'px'; el.style.top = card.y + 'px';
    };
    const mu = () => {
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('mouseup', mu);
      if (moved) ApiClient.dashboard.update(card.id, {x: card.x, y: card.y}).catch(()=>{});
    };
    window.addEventListener('mousemove', mm);
    window.addEventListener('mouseup', mu);
  });
}

function toggleComments(id) {
  const panel = document.getElementById('cp-' + id);
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

async function createCard() {
  const title = document.getElementById('c-title').value.trim();
  const author = document.getElementById('c-author').value.trim() || 'anonymous';
  if (!title) { toast('Title required','error'); return; }
  try {
    const card = await ApiClient.dashboard.create({
      title, body: document.getElementById('c-body').value.trim(),
      color: document.getElementById('c-color').value, author,
      x: 40 + Math.random()*200, y: 40 + Math.random()*200,
    });
    _cards.push(card); mountCard(card);
    document.getElementById('c-title').value=''; document.getElementById('c-body').value='';
    toast('Card posted','success');
  } catch(e) { toast(e.message,'error'); }
}

async function deleteCard(id) {
  try { await ApiClient.dashboard.remove(id); _cards = _cards.filter(c=>c.id!==id); renderCards(); toast('Card removed','success'); }
  catch(e) { toast(e.message,'error'); }
}

async function addComment(cardId) {
  const text = document.getElementById('cm-text-'+cardId).value.trim();
  const author = document.getElementById('cm-author-'+cardId).value.trim() || 'anonymous';
  if (!text) return;
  try {
    await ApiClient.dashboard.addComment(cardId, {text, author});
    toast('Comment added','success'); loadCards();
  } catch(e) { toast(e.message,'error'); }
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
loadCards();
</script>
