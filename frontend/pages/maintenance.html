    <div class="card">
      <div class="card-title">Add Task</div>
      <div class="grid-3 gap-12">
        <div class="form-group" style="margin:0"><label class="form-label">Title</label><input id="m-title" class="form-input" placeholder="Update dependencies" /></div>
        <div class="form-group" style="margin:0"><label class="form-label">Category</label>
          <select id="m-cat" class="form-select">
            <option value="dependency_update">Dependency Update</option>
            <option value="security_patch">Security Patch</option>
            <option value="database_backup">Database Backup</option>
            <option value="certificate_renewal">Certificate Renewal</option>
            <option value="code_audit">Code Audit</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group" style="margin:0"><label class="form-label">Due Date</label><input id="m-due" class="form-input" type="date" /></div>
        <div class="form-group" style="margin:0"><label class="form-label">Recurrence</label>
          <select id="m-rec" class="form-select">
            <option value="none">None</option><option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option><option value="quarterly">Quarterly</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;grid-column:span 2"><label class="form-label">Description (optional)</label><input id="m-desc" class="form-input" placeholder="What needs doing�" /></div>

      <button class="btn btn-primary mt-16" onclick="createTask()">Add Task</button>
    </div>

    <div class="card mt-16">
      <div class="flex justify-between items-center" style="margin-bottom:12px">

      </div>

        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Due Date</th><th>Recurrence</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="tasks-tbody"><tr><td colspan="6" class="text-muted" style="text-align:center;padding:24px">Loading�</td></tr></tbody>
        </table>
      </div>
    </div>

<script src="../static/app.js"></script><script src="../static/api-client.js"></script>
<script>
const CAT_LABELS = {dependency_update:'Dep Update',security_patch:'Security Patch',database_backup:'DB Backup',certificate_renewal:'Cert Renewal',code_audit:'Code Audit',other:'Other'};
const CAT_BADGE  = {dependency_update:'badge-info',security_patch:'badge-danger',database_backup:'badge-accent',certificate_renewal:'badge-warning',code_audit:'badge-muted',other:'badge-muted'};

async function loadTasks() {
  try {
    const {tasks} = await ApiClient.maintenance.list();
    const tbody = document.getElementById('tasks-tbody');
    const overdue = tasks.filter(t=>t.overdue);
    const oc = document.getElementById('overdue-count');
    if (overdue.length) { oc.textContent=`${overdue.length} overdue`; oc.style.display=''; }
    else oc.style.display='none';
    if (!tasks.length) { tbody.innerHTML='<tr><td colspan="6" class="text-muted" style="text-align:center;padding:24px">No tasks yet.</td></tr>'; return; }
    tbody.innerHTML = tasks.map(t=>`
      <tr class="${t.overdue?'overdue-row':''}">
        <td><strong>${escHtml(t.title)}</strong>${t.overdue?'<span class="overdue-badge">overdue</span>':''}
            ${t.description?`<div class="text-muted text-sm">${escHtml(t.description)}</div>`:''}
        </td>
        <td><span class="badge ${CAT_BADGE[t.category]||'badge-muted'}">${CAT_LABELS[t.category]||t.category}</span></td>
        <td class="${t.overdue?'':'text-muted'}" style="${t.overdue?'color:var(--danger);font-weight:600':''}">${t.due_date}</td>
        <td class="text-muted text-sm">${t.recurrence}</td>
        <td>
          ${t.status==='completed'
            ? '<span class="badge badge-success">Completed</span>'
            : `<button class="btn btn-ghost btn-sm" onclick="completeTask(${t.id})">? Done</button>`}
        </td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})">Delete</button></td>
      </tr>`).join('');
  } catch(e) { toast(e.message,'error'); }
}

async function createTask() {
  const title    = document.getElementById('m-title').value.trim();
  const due_date = document.getElementById('m-due').value;
  if (!title || !due_date) { toast('Title and due date required','error'); return; }
  try {
    await ApiClient.maintenance.create({
      title, description: document.getElementById('m-desc').value.trim(),
      category: document.getElementById('m-cat').value,
      due_date, recurrence: document.getElementById('m-rec').value,
    });
    document.getElementById('m-title').value=''; document.getElementById('m-desc').value='';
    toast('Task added','success'); loadTasks();
  } catch(e) { toast(e.message,'error'); }
}

async function completeTask(id) {
  try { await ApiClient.maintenance.update(id,{status:'completed'}); toast('Task completed','success'); loadTasks(); }
  catch(e) { toast(e.message,'error'); }
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  try { await ApiClient.maintenance.remove(id); toast('Task deleted','success'); loadTasks(); }
  catch(e) { toast(e.message,'error'); }
}

// default due date to today
document.getElementById('m-due').value = new Date().toISOString().split('T')[0];

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
loadTasks();
</script>
