      <div class="page-header-text">
        <div class="page-title">Analyzer</div>
        <div class="page-sub">Stack detection and tool suggestions from file listings.</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Project File Listing</div>
      <div class="form-group"><label class="form-label">Paste file paths (one per line, e.g. from <code>find . -type f</code>)</label>
        <textarea id="a-listing" class="form-textarea" style="min-height:180px;font-family:monospace;font-size:12.5px" placeholder="requirements.txt&#10;backend/main.py&#10;frontend/index.html&#10;Dockerfile&#10;.github/workflows/ci.yml"></textarea>
      </div>
      <div class="form-group"><label class="form-label">Tech hints (optional � e.g. &quot;uses React, deployed on AWS&quot;)</label>
        <input id="a-hints" class="form-input" placeholder="Additional context�" />
      </div>
      <button class="btn btn-primary" onclick="runAnalysis()">Analyze Stack</button>
    </div>

    <div id="results" style="display:none">
      <div class="card mt-16">
        <div class="card-title">?? Detected Stack</div>
        <div id="stack-list" style="display:flex;flex-wrap:wrap;gap:8px"></div>
      </div>
      <div class="card mt-16">
        <div class="card-title">?? Conventions Detected</div>
        <ul id="conventions-list" style="padding-left:20px;color:var(--text-muted);font-size:13.5px;line-height:2"></ul>
      </div>
      <div class="card mt-16">
        <div class="card-title">??? Recommended Tools</div>
        <div id="tools-table"></div>
      </div>
    </div>
  </main>
</div>
<script src="../static/app.js"></script><script src="../static/api-client.js"></script>
<script>
async function runAnalysis() {
  const file_listing = document.getElementById('a-listing').value.trim();
  const tech_hints   = document.getElementById('a-hints').value.trim();
  if (!file_listing) { toast('Paste a file listing first','error'); return; }
  try {
    const res = await ApiClient.analyzer.analyze({file_listing, tech_hints});
    document.getElementById('stack-list').innerHTML =
      res.stack_summary.map(s => `<span class="badge badge-accent" style="font-size:13px;padding:5px 12px">${s}</span>`).join('');
    document.getElementById('conventions-list').innerHTML =
      res.conventions.map(c => `<li>${c}</li>`).join('');
    document.getElementById('tools-table').innerHTML = `
      <table><thead><tr><th>Category</th><th>Tools</th><th>Reason</th></tr></thead>
      <tbody>${res.tool_suggestions.map(t =>
        `<tr><td><span class="badge badge-muted">${t.category}</span></td>
             <td>${t.tools.map(tool => `<span class="badge badge-info" style="margin:2px">${tool}</span>`).join(' ')}</td>
             <td class="text-muted text-sm">${t.reason}</td></tr>`
      ).join('')}</tbody></table>`;
    document.getElementById('results').style.display = 'block';
    toast('Analysis complete','success');
  } catch(e) { toast(e.message,'error'); }
}
</script>
