<script src="../static/api-client.js"></script>
<script>
const ROLE_BADGES = { lead:'badge-accent', developer:'badge-info', reviewer:'badge-warning', tester:'badge-muted' };

async function loadMembers() {
  try {
    const { members } = await ApiClient.teams.list();
    const tbody = document.getElementById('members-tbody');
    document.getElementById('member-count').textContent = `${members.length} member${members.length !== 1 ? 's' : ''}`;
    if (!members.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-muted" style="text-align:center;padding:24px">No members yet � add one above.</td></tr>';
      return;
    }
    tbody.innerHTML = members.map(m => `
      <tr>
        <td><strong>${escHtml(m.name)}</strong></td>
        <td class="text-muted">${escHtml(m.email)}</td>
        <td>
          <select class="form-select" style="width:auto;padding:3px 8px;font-size:12px"
            onchange="changeRole(${m.id}, this.value)">
            ${['lead','developer','reviewer','tester'].map(r =>
              `<option value="${r}"${m.role===r?' selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`
            ).join('')}
          </select>
        </td>
        <td class="text-muted text-sm">${m.joined_at ? new Date(m.joined_at).toLocaleDateString() : '�'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="removeMember(${m.id})">Remove</button></td>
      </tr>`).join('');
  } catch(e) { toast(e.message, 'error'); }
}

async function addMember() {
  const name  = document.getElementById('inp-name').value.trim();
  const email = document.getElementById('inp-email').value.trim();
  const role  = document.getElementById('inp-role').value;
  if (!name || !email) { toast('Name and email are required', 'error'); return; }
  try {
    await ApiClient.teams.create({ name, email, role });
    document.getElementById('inp-name').value = '';
    document.getElementById('inp-email').value = '';
    toast('Member added', 'success');
    loadMembers();
  } catch(e) { toast(e.message, 'error'); }
}

async function removeMember(id) {
  if (!confirm('Remove this member?')) return;
  try { await ApiClient.teams.remove(id); toast('Member removed', 'success'); loadMembers(); }
  catch(e) { toast(e.message, 'error'); }
}

async function changeRole(id, role) {
  try { await ApiClient.teams.updateRole(id, { role }); toast('Role updated', 'success'); }
  catch(e) { toast(e.message, 'error'); loadMembers(); }
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
loadMembers();
</script>
