    <div class="card mt-16">

<script src="../static/app.js"></script><script src="../static/api-client.js"></script>
<script>
const PRI_BADGE = {high:'badge-danger', medium:'badge-warning', low:'badge-info'};
const PRI_ICON  = {high:'??', medium:'??', low:'??'};

async function summarize() {
  const changes_text = document.getElementById('r-text').value.trim();
  if (!changes_text) { toast('Paste some changes first','error'); return; }
  try {
    const res = await ApiClient.review.summarize({changes_text});
    renderSummary(res);
    toast(`Summary: ${res.items.length} item${res.items.length!==1?'s':''}`, 'success');
    loadHistory();
  } catch(e) { toast(e.message,'error'); }
}

function renderSummary(res) {
  const out = document.getElementById('summary-out');
  const counts = {high:0,medium:0,low:0};
  res.items.forEach(i => counts[i.priority] = (counts[i.priority]||0)+1);
  out.innerHTML = `
    <div class="card">
      <div class="flex gap-8 items-center" style="margin-bottom:16px">
        <div class="card-title" style="margin:0">Review Summary #${res.id}</div>
        <span class="badge badge-danger">${counts.high} high</span>
        <span class="badge badge-warning">${counts.medium} medium</span>
        <span class="badge badge-info">${counts.low} low</span>
      </div>
      ${res.items.map(i => `
        <div class="card priority-${i.priority}" style="margin-top:10px;padding:12px 16px">
          <div class="flex items-center gap-8" style="margin-bottom:4px">
            <span class="badge ${PRI_BADGE[i.priority]}">${PRI_ICON[i.priority]} ${i.priority}</span>
            <span class="badge badge-muted">${i.category}</span>
          </div>
          <p style="margin:0;font-size:13.5px">${escHtml(i.summary)}</p>
        </div>`).join('')}
    </div>`;
  out.style.display = 'block';
}

async function loadHistory() {
  try {
    const {history} = await ApiClient.review.history();
    const el = document.getElementById('history-list');
    if (!history.length) { el.innerHTML='<p class="text-muted text-sm">No history yet.</p>'; return; }
    el.innerHTML = `<table><thead><tr><th>ID</th><th>High</th><th>Medium</th><th>Low</th><th>Date</th></tr></thead><tbody>
      ${history.map(r => {
        const c={high:0,medium:0,low:0};
        r.items.forEach(i=>{c[i.priority]=(c[i.priority]||0)+1;});
        return `<tr>
          <td class="text-muted">#${r.id}</td>
          <td><span class="badge badge-danger">${c.high}</span></td>
          <td><span class="badge badge-warning">${c.medium}</span></td>
          <td><span class="badge badge-info">${c.low}</span></td>
          <td class="text-muted text-sm">${r.created_at?new Date(r.created_at).toLocaleDateString():'�'}</td>
        </tr>`;}).join('')}</tbody></table>`;
  } catch(e) {}
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
loadHistory();
</script>
