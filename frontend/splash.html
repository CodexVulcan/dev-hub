<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADE.UA — Agentic Development Ecosystem</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #07080f;
      --grid:    rgba(79, 142, 247, 0.045);
      --accent:  #4f8ef7;
      --accent2: #7c5cd8;
      --text:    #e2e4ed;
      --muted:   #50566e;
      --success: #2ecc71;
    }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    }

    /* -- Animated grid background --------------------------- */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: grid-drift 20s linear infinite;
    }
    @keyframes grid-drift {
      0%   { background-position: 0 0; }
      100% { background-position: 48px 48px; }
    }

    /* -- Glowing orbs --------------------------------------- */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(90px); opacity: 0; z-index: 0;
      animation: orb-appear 1.2s ease forwards;
    }
    .orb-1 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(79,142,247,.25) 0%, transparent 70%);
      top: -120px; left: -80px;
      animation-delay: 0.2s;
    }
    .orb-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(124,92,216,.22) 0%, transparent 70%);
      bottom: -100px; right: -60px;
      animation-delay: 0.5s;
    }
    .orb-3 {
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(46,204,113,.12) 0%, transparent 70%);
      top: 55%; left: 55%;
      animation-delay: 0.9s;
    }
    @keyframes orb-appear {
      to { opacity: 1; }
    }

    /* -- Stage container ------------------------------------ */
    .stage {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; gap: 0;
    }

    /* -- Monogram ring -------------------------------------- */
    .ring-wrap {
      position: relative; width: 110px; height: 110px;
      margin-bottom: 32px;
      opacity: 0; transform: scale(.6);
      animation: ring-in .7s cubic-bezier(.34,1.56,.64,1) .15s forwards;
    }
    @keyframes ring-in {
      to { opacity: 1; transform: scale(1); }
    }
    .ring-wrap svg {
      position: absolute; inset: 0;
      animation: ring-spin 12s linear infinite;
    }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    .ring-inner {
      position: absolute; inset: 14px;
      background: linear-gradient(135deg, #1a1d27 60%, #22263a 100%);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900;
      background-clip: text;
      -webkit-background-clip: text;
    }
    .ring-monogram {
      font-size: 28px; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* -- Logo wordmark -------------------------------------- */
    .wordmark {
      display: flex; align-items: baseline; gap: 0;
      opacity: 0; transform: translateY(18px);
      animation: word-in .65s ease .55s forwards;
    }
    @keyframes word-in {
      to { opacity: 1; transform: translateY(0); }
    }
    .word-ade {
      font-size: clamp(52px, 10vw, 86px);
      font-weight: 900;
      letter-spacing: -3px;
      background: linear-gradient(120deg, #fff 30%, var(--accent) 80%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .word-dot {
      font-size: clamp(44px, 8vw, 72px);
      font-weight: 300; color: var(--muted);
      margin: 0 2px;
      opacity: 0;
      animation: dot-pop .4s ease .95s forwards;
    }
    @keyframes dot-pop {
      0%  { opacity: 0; transform: scale(0); }
      60% { transform: scale(1.4); }
      100%{ opacity: 1; transform: scale(1); }
    }
    .word-ua {
      font-size: clamp(52px, 10vw, 86px);
      font-weight: 900; letter-spacing: -3px;
      background: linear-gradient(120deg, var(--accent2) 20%, #c084fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0; transform: translateY(18px);
      animation: word-in .65s ease .75s forwards;
    }

    /* -- Full name expansion -------------------------------- */
    .expansion {
      display: flex; gap: 20px; margin-top: 18px; flex-wrap: wrap; justify-content: center;
      opacity: 0; transform: translateY(10px);
      animation: word-in .5s ease 1.25s forwards;
    }
    .exp-part {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .exp-abbr {
      font-size: 18px; font-weight: 800; letter-spacing: 2px;
      color: var(--accent);
    }
    .exp-abbr.purple { color: var(--accent2); }
    .exp-full {
      font-size: 11.5px; color: var(--muted); letter-spacing: .8px; text-transform: uppercase;
    }
    .exp-sep {
      font-size: 28px; color: var(--muted); align-self: center; opacity: .35;
    }

    /* -- Tagline -------------------------------------------- */
    .tagline {
      margin-top: 28px;
      font-size: 14px; color: var(--muted); letter-spacing: 2.5px; text-transform: uppercase;
      opacity: 0;
      animation: word-in .5s ease 1.55s forwards;
    }

    /* -- Founders strip ------------------------------------- */
    .founders {
      display: flex; gap: 32px; margin-top: 36px;
      opacity: 0; transform: translateY(8px);
      animation: word-in .5s ease 1.8s forwards;
    }
    .founder { text-align: center; }
    .founder-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800; margin: 0 auto 6px;
    }
    .av-u { background: linear-gradient(135deg,#1e3a6e,#3b82f6); color: #93c5fd; }
    .av-a { background: linear-gradient(135deg,#2e1065,#7c3aed); color: #c4b5fd; }
    .founder-name  { font-size: 13px; font-weight: 600; color: var(--text); }
    .founder-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* -- Progress bar --------------------------------------- */
    .progress-wrap {
      position: absolute; bottom: 52px;
      width: min(320px, 70vw);
      opacity: 0; animation: word-in .4s ease 2s forwards;
    }
    .progress-label { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .progress-label span { font-size: 11.5px; color: var(--muted); letter-spacing: .8px; }
    .progress-track {
      height: 3px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      width: 0%;
      animation: prog-fill 2.2s cubic-bezier(.4,0,.2,1) 2.1s forwards;
    }
    @keyframes prog-fill {
      to { width: 100%; }
    }

    /* -- Enter button --------------------------------------- */
    .enter-btn {
      position: absolute; bottom: 52px;
      display: none;
      padding: 12px 40px; border-radius: 99px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 14px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      border: none; cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 32px rgba(79,142,247,.35);
      animation: btn-pulse 2s ease infinite;
    }
    @keyframes btn-pulse {
      0%,100% { box-shadow: 0 0 24px rgba(79,142,247,.3); }
      50%      { box-shadow: 0 0 48px rgba(79,142,247,.6); }
    }

    /* -- Particle canvas ------------------------------------ */
    #particle-canvas { position:fixed; inset:0; z-index:1; pointer-events:none; }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="particle-canvas"></canvas>

<div class="stage">

  <!-- Spinning ring monogram -->
  <div class="ring-wrap">
    <svg viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="55" cy="55" r="50" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="6 4" />
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="110" y2="110" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4f8ef7"/>
          <stop offset="100%" stop-color="#7c5cd8"/>
        </linearGradient>
      </defs>
    </svg>
    <div class="ring-inner">
      <span class="ring-monogram">ADE</span>
    </div>
  </div>

  <!-- ADE.UA wordmark -->
  <div class="wordmark">
    <span class="word-ade">ADE</span>
    <span class="word-dot">.</span>
    <span class="word-ua">UA</span>
  </div>

  <!-- Full name expansion -->
  <div class="expansion">
    <div class="exp-part">
      <span class="exp-abbr">A</span>
      <span class="exp-full">Agentic</span>
    </div>
    <div class="exp-part">
      <span class="exp-abbr">D</span>
      <span class="exp-full">Development</span>
    </div>
    <div class="exp-part">
      <span class="exp-abbr">E</span>
      <span class="exp-full">Ecosystem</span>
    </div>
    <span class="exp-sep">·</span>
    <div class="exp-part">
      <span class="exp-abbr purple">U</span>
      <span class="exp-full">Utkarsh</span>
    </div>
    <div class="exp-part">
      <span class="exp-abbr purple">A</span>
      <span class="exp-full">Aman</span>
    </div>
  </div>

  <!-- Tagline -->
  <div class="tagline">Unified platform for modern developer teams</div>

  <!-- Founders -->
  <div class="founders">
    <div class="founder">
      <div class="founder-avatar av-u">U</div>
      <div class="founder-name">Utkarsh</div>
      <div class="founder-label">Co-founder</div>
    </div>
    <div class="founder">
      <div class="founder-avatar av-a">A</div>
      <div class="founder-name">Aman</div>
      <div class="founder-label">Co-founder</div>
    </div>
  </div>

  <!-- Progress bar (auto-redirect) -->
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-label">
      <span>Initialising DevHub</span>
      <span id="pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill"></div>
    </div>
  </div>

  <!-- Enter button (shown when ready) -->
  <a class="enter-btn" id="enter-btn" href="index.html">Enter DevHub ?</a>

</div>

<script>
/* -- Particle system --------------------------------------------------- */
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b) { return a + Math.random()*(b-a); }

  function spawn() {
    return {
      x: rand(0,W), y: rand(0,H),
      vx: rand(-.25,.25), vy: rand(-.4,-.05),
      r: rand(1,2.5),
      alpha: rand(.15,.5),
      life: rand(120,280), age: 0,
      color: Math.random() > .5 ? '79,142,247' : '124,92,216'
    };
  }

  for (let i=0;i<80;i++) particles.push(spawn());

  function tick() {
    ctx.clearRect(0,0,W,H);
    particles.forEach((p,i) => {
      p.x += p.vx; p.y += p.vy; p.age++;
      const fade = p.age < 20 ? p.age/20 : p.age > p.life-20 ? (p.life-p.age)/20 : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha*fade})`;
      ctx.fill();
      if (p.age >= p.life) particles[i] = spawn();
    });
    requestAnimationFrame(tick);
  }
  tick();
})();

/* -- Progress counter & auto-redirect --------------------------------- */
(function() {
  const pctEl = document.getElementById('pct');
  const fillEl = document.getElementById('prog-fill');
  const progressWrap = document.getElementById('progress-wrap');
  const enterBtn = document.getElementById('enter-btn');
  let val = 0;
  const startAt = 2100; // matches CSS animation delay

  setTimeout(() => {
    const iv = setInterval(() => {
      val = Math.min(val + Math.random()*4, 100);
      pctEl.textContent = Math.floor(val) + '%';
      if (val >= 100) {
        clearInterval(iv);
        pctEl.textContent = '100%';
        // swap progress ? enter button
        setTimeout(() => {
          progressWrap.style.display = 'none';
          enterBtn.style.display = 'block';
          // auto-redirect after 1.4s
          setTimeout(() => { window.location.href = 'index.html'; }, 1400);
        }, 400);
      }
    }, 55);
  }, startAt);
})();
</script>
</body>
</html>
